:root{

*,*::before,*::after{box-sizing:inherit}

.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto;position:relative;z-index:2}

.top{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:transform .4s var(--ease)}
.top__bar{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top__inner{display:flex;align-items:center;justify-content:flex-end;height:64px;gap:.5rem;transition:height .35s var(--ease)}
.top__rule{height:12px;background:var(--red);transform-origin:left;transition:height .35s var(--ease)}
.top.is-compact .top__inner{height:52px}
.top.is-compact .top__rule{height:5px}
.logo{position:absolute;left:0;top:0;width:66px;height:124px;transition:transform .45s var(--ease);transform-origin:top center;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.top.is-compact .logo{transform:scale(.58)}
.logo svg{width:100%;height:100%}
.nav{display:flex;gap:clamp(.4rem,2.2vw,2.4rem);margin-right:auto;margin-left:clamp(90px,14vw,190px)}
.nav a{font:500 1rem var(--body);text-decoration:none;padding:.4rem .2rem;position:relative;color:var(--ink)}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red);transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav a:hover::after,.nav a.is-active::after{transform:scaleX(1);transform-origin:left}
.menu-btn{display:none;background:none;border:0;color:var(--ink);width:44px;height:44px;cursor:pointer}
.menu-btn span{display:block;width:24px;height:2px;background:currentColor;margin:5px auto;transition:transform .3s}
.lang-btn{flex-shrink:0;background:none;border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:.4rem .95rem;font:700 .85rem var(--body);letter-spacing:.03em;cursor:pointer;transition:background .3s,color .3s,transform .3s var(--ease);position:relative;z-index:2}
.lang-btn:hover{background:var(--blue);color:#fff;transform:translateY(-1px)}
.theme-btn{flex-shrink:0;display:grid;place-items:center;width:38px;height:38px;padding:0;background:none;border:2px solid var(--blue);color:var(--blue);border-radius:50%;cursor:pointer;transition:background .3s,color .3s,transform .3s var(--ease);position:relative;z-index:2}
.theme-btn:hover{background:var(--blue);color:#fff;transform:translateY(-1px)}
.theme-btn svg{width:18px;height:18px}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}

/* ---------- Side dots ---------- */
.dots{position:fixed;right:clamp(10px,2.2vw,36px);top:50%;transform:translateY(-50%);z-index:40;background:var(--red);border-radius:20px;padding:22px 11px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);transition:background .5s}
.dots.on-red{background:var(--blue)}
.dots button{width:15px;height:15px;border-radius:50%;border:2px solid #fff;background:#fff;padding:0;cursor:pointer;transition:background .3s,transform .3s}
.dots button.is-active{background:transparent;transform:scale(1.25)}
.dots button:hover{transform:scale(1.25)}

/* ---------- Shared diagonal shapes ---------- */
.shape{position:absolute;pointer-events:none;will-change:transform;z-index:0}
section{position:relative;overflow:hidden}

/* ---------- Hero ---------- */
.hero{min-height:100svh;padding:calc(env(safe-area-inset-top,0px) + 150px) 0 120px;display:flex;align-items:center}
.hero .shape--band{top:20%;bottom:-30%;left:0;right:0;background:var(--blue);clip-path:polygon(100% 0,100% 100%,0 100%);animation:band 1.3s var(--ease) both}
.hero .shape--thin{inset:0;background:var(--red);clip-path:polygon(100% 11%,100% 13.5%,58% 59.7%,58% 57.2%);opacity:.9;animation:fadeIn 1s .9s both}
@keyframes band{from{clip-path:polygon(100% 0,100% 0,100% 0)}}
.hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.hero__kicker{font:700 1rem var(--body);color:var(--red);margin:0 0 1rem;display:flex;align-items:center;gap:.7rem}
.hero__kicker::before{content:"";width:36px;height:3px;background:currentColor}
.hero h1{font-size:clamp(2.3rem,5vw,4.3rem);font-weight:900;text-transform:uppercase;font-stretch:125%}
.hero h1 .ln{display:block;overflow:hidden}
.hero h1 .ln>span{display:block;animation:rise 1s var(--ease) both}
.hero h1 .ln:nth-child(2)>span{animation-delay:.12s}

@keyframes rise{from{transform:translateY(105%)}}
.hero__text{max-width:34em;margin:1.6rem 0 2rem;color:var(--muted);animation:fadeIn .9s .55s both}
.hero__cta{display:flex;flex-wrap:wrap;gap:.8rem;animation:fadeIn .9s .7s both}
.btn{display:inline-flex;align-items:center;gap:.6rem;font:700 1rem var(--body);padding:.9rem 1.5rem;border-radius:10px;text-decoration:none;border:2px solid var(--blue);cursor:pointer;transition:transform .3s var(--ease),background .3s,color .3s}
.btn--solid{background:var(--blue);color:#fff}
.btn--solid:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}
.btn--ghost{background:transparent;color:var(--blue)}
.btn--ghost:hover{background:var(--blue);color:#fff;transform:translateY(-2px)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}}
.portrait{position:relative;justify-self:center;width:min(430px,100%)}
.portrait__frame{position:relative;aspect-ratio:1;background:#fff;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);animation:unveil 1.2s .35s var(--ease) both;box-shadow:var(--shadow)}
.portrait__frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);animation:settle 1.8s .35s var(--ease) both}
@keyframes unveil{from{clip-path:polygon(0 100%,0 100%,0 100%,0 100%)}}
@keyframes settle{from{transform:scale(1.25)}}
.portrait__offset{position:absolute;inset:18px -18px -18px 18px;border:3px solid var(--red);z-index:-1;animation:fadeIn 1s 1s both}
.portrait__tag{position:absolute;left:-22px;bottom:28px;background:var(--red);color:#fff;font:800 1rem var(--display);font-stretch:120%;padding:.7rem 1.1rem;animation:fadeIn .8s 1.2s both}

/* ---------- Education ---------- */
.edu{background:var(--paper);color:var(--ink);padding:130px 0 100px}
.edu .shape--light{inset:-12% 0;background:var(--blue);clip-path:polygon(0 0,100% 0,100% 12%,50% 24%,40% 100%,0 100%)}
.edu__grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
.seal{width:min(400px,80%);justify-self:center;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.seal img{width:100%;border-radius:50%}
.edu__block+.edu__block{margin-top:2.6rem}
.edu__block h2{font-size:clamp(1.6rem,3vw,2.3rem);font-weight:800;text-transform:uppercase}
.edu__block h2{color:var(--blue-deep)}
.edu__block .sub{font:700 1rem var(--body);color:var(--red);margin:.5rem 0 .6rem}
.edu__block p{margin:0;max-width:36em;color:var(--muted)}
:root[data-theme="dark"] .edu__block h2{color:#9FD0F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .edu__block h2{color:#9FD0F5}}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:90px;position:relative;z-index:2}
.tool{background:var(--surface);color:var(--ink);border-radius:16px;padding:1.1rem 1.2rem 1.2rem;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
.tool:hover{transform:translateY(-6px) rotate(-.5deg)}
.tool h3{font-size:.95rem;font-weight:700;color:var(--muted);margin-bottom:.8rem;font-family:var(--body);font-stretch:100%}
.tool ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.6rem}
.chip{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:68px}
.chip b{width:54px;height:54px;border-radius:12px;background:var(--blue);display:grid;place-items:center;padding:.65rem;transition:background .3s,transform .3s var(--ease)}
.chip b img{width:100%;height:100%;object-fit:contain}
.chip:hover b{background:var(--red);transform:scale(1.08)}
.chip span{font-size:.75rem;text-align:center;line-height:1.2;color:var(--muted)}

/* ---------- Experience ---------- */
.exp{background:var(--blue);padding:110px 0}
.exp .shape--tri{top:-5%;right:-2%;width:48%;height:110%;background:var(--red);clip-path:polygon(100% 0,100% 100%,0 50%)}
.panel{position:relative;z-index:2;background:var(--paper);border:3px solid var(--red);border-radius:40px 0 0 40px;padding:clamp(2rem,5vw,4rem);max-width:980px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.panel h2{font-size:clamp(2rem,4vw,3rem);font-weight:900}
.timeline{display:grid;grid-template-columns:1fr 1fr;gap:2.8rem 3.4rem;margin-top:2.6rem}
.job{position:relative;padding-left:1.4rem;border-left:3px solid var(--line)}
.job::before{content:"";position:absolute;left:-3px;top:0;width:3px;height:0;background:var(--red);transition:height 1s .2s var(--ease)}
.job.in::before{height:100%}
.job h3{font-size:1.35rem;font-weight:800;text-transform:uppercase;color:var(--blue)}
.job .role{font-weight:700;margin:.35rem 0 0}
.job .when{font-size:.9rem;color:var(--muted);margin:.1rem 0 .7rem}
.job p{margin:0;color:var(--muted);font-size:.98rem}

/* ---------- Work ---------- */
.work{background:var(--surface);padding:110px 0 120px}
.work .shape--red{inset:-10%;background:var(--red);clip-path:polygon(0 8%,40% 38%,100% 62%,100% 100%,0 100%)}
.work h2{text-align:center;font-size:clamp(2rem,4vw,3rem);font-weight:900;text-transform:uppercase}
.work__hint{text-align:center;color:var(--muted);margin:.6rem 0 2.2rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.6rem,3vw,2.6rem);max-width:1000px;margin:0 auto}
.tab{font:800 clamp(1rem,2vw,1.35rem) var(--display);font-stretch:112%;padding:1.1rem .6rem;border-radius:18px;border:2px solid var(--blue);background:var(--paper);color:var(--ink);cursor:pointer;position:relative;overflow:hidden;transition:transform .35s var(--ease),background .35s,color .35s,box-shadow .35s}
.tab:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.tab[aria-expanded="true"]{background:var(--sky);color:var(--blue-deep)}
:root[data-theme="dark"] .tab[aria-expanded="true"]{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-expanded="true"]{color:#fff}}
.tab small{display:block;font:400 .8rem var(--body);opacity:.7;margin-top:.2rem}
.gallery{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease);margin-top:2rem}
.gallery.open{grid-template-rows:1fr}
.gallery__inner{overflow:hidden;min-height:0}
.stage{position:relative;background:var(--surface);border:2px solid var(--blue);border-radius:22px;padding:2rem clamp(1rem,3vw,2rem);margin:0 clamp(0rem,3vw,2rem) .5rem;box-shadow:var(--shadow)}
.stage__head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem;gap:1rem}
.stage__head h3{font-size:1.4rem;font-weight:800}
.stage__head span{color:var(--muted);font-size:.9rem}
.track{display:flex;gap:1.4rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:.4rem;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 calc((100% - 2.8rem)/3);scroll-snap-align:start;border:0;padding:0;background:none;text-align:left;cursor:zoom-in;color:inherit;font:inherit;opacity:0;transform:translateX(40px)}
.gallery.open .card{animation:slideIn .7s var(--ease) forwards}
@keyframes slideIn{to{opacity:1;transform:none}}
.card__media{position:relative;aspect-ratio:4/5;overflow:hidden;background:#858585;border-radius:6px}
.card__media img,.card__media video{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.card:hover .card__media img{transform:scale(1.06)}
.card__media::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(12,50,89,.75));opacity:0;transition:opacity .4s}
.card:hover .card__media::after{opacity:1}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;z-index:2;transition:transform .3s var(--ease)}
.card:hover .play{transform:scale(1.12)}
.card h4{font:800 1.05rem var(--display);font-stretch:112%;margin:.8rem 0 .15rem}
.card p{margin:0;font-size:.9rem;color:var(--muted)}
.arrow{position:absolute;top:50%;width:52px;height:74px;border:0;background:none;cursor:pointer;transform:translateY(-50%);z-index:3;padding:0;transition:transform .3s var(--ease),opacity .3s}
.arrow svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.arrow--prev{left:-34px}.arrow--next{right:-34px}
.arrow:hover{transform:translateY(-50%) scale(1.1)}
.arrow:disabled{opacity:.25;cursor:default}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:1.2rem;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}

/* ---------- Contact ---------- */
.contact{background:var(--red);color:#fff;padding:120px 0 60px}
.contact .shape--paper{inset:-10%;background:var(--paper);clip-path:polygon(0 58%,100% 78%,100% 100%,0 100%)}
.contact .shape--blue{inset:-10%;background:var(--blue);clip-path:polygon(100% 0,100% 30%,70% 0)}
.contact h2{font-size:clamp(2.4rem,6vw,4.8rem);font-weight:900;text-transform:uppercase;text-align:center;font-stretch:125%}
.contact__lead{text-align:center;max-width:32em;margin:1rem auto 3rem;opacity:.92}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
.way{background:var(--surface);color:var(--ink);border-radius:18px;padding:1.6rem;text-decoration:none;display:flex;flex-direction:column;gap:.4rem;box-shadow:0 24px 40px -22px rgba(0,0,0,.55);transition:transform .4s var(--ease);position:relative;overflow:hidden}
.way::before{content:"";position:absolute;inset:auto -20% -60% auto;width:160px;height:160px;background:var(--blue);clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.12;transition:transform .5s var(--ease)}
.way:hover{transform:translateY(-8px)}
.way:hover::before{transform:scale(1.6)}
.way__icon{width:48px;height:48px;border-radius:12px;background:var(--blue);display:grid;place-items:center;margin-bottom:.6rem}
.way__icon svg{width:26px;height:26px}
.way strong{font:800 1.2rem var(--display);font-stretch:112%}
.way span{color:var(--muted);word-break:break-word}
.way em{font-style:normal;font-weight:700;color:var(--red);margin-top:.6rem}
.foot{margin-top:5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;color:var(--ink);font-size:.9rem;position:relative;z-index:2}
.foot button{background:none;border:2px solid var(--ink);color:var(--ink);border-radius:8px;padding:.5rem .9rem;font:700 .9rem var(--body);cursor:pointer}

/* ---------- Reveal (scroll) ---------- */
.rv{clip-path:polygon(0 0,0 0,0 100%,0 100%);transition:clip-path 1.1s var(--ease)}
.rv.in{clip-path:polygon(0 0,110% 0,100% 100%,0 100%)}
.rv-up{opacity:0;transform:translateY(40px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv-up.in{opacity:1;transform:none}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,22,40,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 60px) 70px calc(env(safe-area-inset-bottom,0px) + 60px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.lb.open{opacity:1;visibility:visible}
.lb figure{margin:0;max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;transform:scale(.94);transition:transform .5s var(--ease)}
.lb.open figure{transform:none}
.lb__media{max-height:74vh;max-width:100%}
.lb__media img,.lb__media video,.lb__media iframe{max-height:74vh;max-width:100%;border-radius:8px}
.lb__media iframe{width:min(960px,86vw);aspect-ratio:16/9;border:0;height:auto}
.lb figcaption{color:#fff;text-align:center;margin-top:1rem}
.lb figcaption b{font:800 1.2rem var(--display);font-stretch:112%;display:block}
.lb__btn{position:absolute;background:none;border:0;color:#fff;cursor:pointer;width:52px;height:52px;display:grid;place-items:center}
.lb__close{top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;font-size:2.2rem}
.lb__prev{left:10px;top:50%;transform:translateY(-50%)}
.lb__next{right:10px;top:50%;transform:translateY(-50%)}
.lb__btn svg{width:34px;height:34px}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .hero__grid,.edu__grid{grid-template-columns:1fr}
  .portrait{max-width:360px;order:-1}
  .hero .shape--band{top:auto;height:22%;bottom:-6%}
  .hero .shape--thin{display:none}
  .edu .shape--light{clip-path:polygon(0 0,100% 0,100% 28%,0 40%)}
  .hero{padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
  .tools,.ways{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr}
  .card{flex-basis:calc((100% - 1.4rem)/2)}
  .dots{display:none}
  .panel{border-radius:28px}
}
@media (max-width:720px){
  .menu-btn{display:block}
  .nav{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;margin:0;flex-direction:column;justify-content:center;align-items:center;gap:1.6rem;background:var(--paper);transform:translateY(-105%);visibility:hidden;transition:transform .5s var(--ease),visibility .5s;z-index:-1}
  .nav a{font:800 1.8rem var(--display);font-stretch:118%}
  .nav.open{transform:none;visibility:visible}
  .portrait__offset{inset:12px -10px -12px 12px}
  .logo{width:48px;height:90px}
  .tabs{grid-template-columns:1fr}
  .card{flex-basis:84%}
  .arrow{display:none}
  .stage{margin:0}
  .portrait__tag{left:0}
  .lb{padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv{clip-path:none}.rv-up{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top__bar">
    <div class="wrap top__inner">
      <a class="logo" href="#inicio" aria-label="Ir al inicio">
        <img src="img/perfil.svg" alt="Logo de mi portafolio" id="logoImg">
      </a>
      <nav class="nav" id="nav" aria-label="Secciones">
        <a href="#inicio" id="navInicio">Inicio</a>
        <a href="#educacion" id="navEducacion">Educación</a>
        <a href="#experiencia" id="navExperiencia">Experiencia</a>
        <a href="#trabajos" id="navTrabajos">Trabajos</a>
        <a href="#contacto" id="navContacto">Contacto</a>
      </nav>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Cambiar idioma">EN</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
  <div class="top__rule"></div>
</header>

<nav class="dots" id="dots" aria-label="Progreso de secciones"></nav>

<main>
  <section class="hero" id="inicio">
    <div class="shape shape--band" data-parallax="-0.12"></div>
    <div class="shape shape--thin" data-parallax="0.18"></div>
    <div class="wrap hero__grid">
      <div>
        <p class="hero__kicker" id="heroRol"></p>
        <h1 id="heroTitle"></h1>
        <p class="hero__text" id="heroText"></p>
        <div class="hero__cta">
          <a class="btn btn--solid" href="#trabajos" id="ctaWork">Ver mi trabajo</a>
          <a class="btn btn--ghost" href="#contacto" id="ctaContact">Contactarme</a>
        </div>
      </div>
      <div class="portrait" data-parallax="-0.06">
        <div class="portrait__offset"></div>
        <div class="portrait__frame"><img id="heroFoto" alt=""></div>
        <div class="portrait__tag" id="heroTag"></div>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <section class="edu" id="educacion">
    <div class="shape shape--light" data-parallax="0.1"></div>
    <div class="wrap">
      <div class="edu__grid">
        <div class="seal" data-parallax="-0.08" data-rotate="1"><img id="eduSeal" alt=""></div>
        <div>
          <div class="edu__block rv-up" id="eduPro"></div>
          <div class="edu__block rv-up" id="eduCom"></div>
        </div>
      </div>
      <div class="tools" id="tools"></div>
    </div>
  </section>

  <section class="exp" id="experiencia">
    <div class="shape shape--tri" data-parallax="0.14"></div>
    <div class="wrap">
      <div class="panel rv-up">
        <h2 id="expTitle">Experiencia</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <section class="work" id="trabajos">
    <div class="shape shape--red" data-parallax="0.08"></div>
    <div class="wrap">
      <h2 class="rv" id="workTitle">Mi trabajo</h2>
      <p class="work__hint" id="workHint">Elige una categoría para abrir la galería.</p>
      <div class="tabs" id="tabs" role="group" aria-label="Categorías de trabajo"></div>
      <div class="gallery" id="gallery">
        <div class="gallery__inner">
          <div class="stage" id="stage" aria-live="polite">
            <div class="stage__head"><h3 id="stageTitle"></h3><span id="stageCount"></span></div>
            <button class="arrow arrow--prev" id="prev" aria-label="Anterior"><svg viewBox="0 0 40 60"><path fill="var(--blue)" stroke="#fff" stroke-width="2" d="M38 2 2 30 38 58 26 30Z"/></svg></button>
            <div class="track" id="track"></div>
            <button class="arrow arrow--next" id="next" aria-label="Siguiente"><svg viewBox="0 0 40 60"><path fill="var(--blue)" stroke="#fff" stroke-width="2" d="M2 2 38 30 2 58 14 30Z"/></svg></button>

            <div class="progress"><i id="bar"></i></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="contact" id="contacto">
    <div class="shape shape--blue" data-parallax="-0.1"></div>
    <div class="shape shape--paper" data-parallax="0.12"></div>
    <div class="wrap">
      <h2 class="rv" id="contactTitle">Hablemos</h2>
      <p class="contact__lead" id="contactLead">¿Tienes un proyecto de diseño, video o web? Escríbeme por el medio que prefieras.</p>
      <div class="ways" id="ways"></div>
      <div class="foot">
        <span id="footText"></span>
        <button id="toTop">Volver arriba</button>
      </div>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Vista ampliada">
  <button class="lb__btn lb__close" id="lbClose" aria-label="Cerrar">×</button>
  <button class="lb__btn lb__prev" id="lbPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 4 7 12l8 8"/></svg></button>
  <figure><div class="lb__media" id="lbMedia"></div><figcaption id="lbCap"></figcaption></figure>
  <button class="lb__btn lb__next" id="lbNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const asset = v => (typeof v === "string" && v.startsWith("asset:")) ? (window.ASSETS?.[v.slice(6)] || "") : v;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- Language ---- */
  let LANG = (() => {
    try { const saved = localStorage.getItem("lang"); if (saved === "es" || saved === "en") return saved; } catch {}
    return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "es";
  })();
  let C = CONFIG[LANG], T = UI[LANG];
  const keys = Object.keys(CONFIG.es.trabajos);
  let current = null, items = [];

  /* ---- Theme ---- */
  const root = document.documentElement;
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  function updateThemeBtn(){
    const b = $("#themeBtn");
    b.setAttribute("aria-label", isDark() ? T.themeToLight : T.themeToDark);
    b.setAttribute("aria-pressed", String(isDark()));
  }
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") root.dataset.theme = t; } catch {}
  if (!root.dataset.theme) root.dataset.theme = isDark() ? "dark" : "light"; // follow system until the user chooses
  $("#themeBtn").addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
    updateThemeBtn();
  });

  /* ---- Placeholder art for empty gallery slots ---- */
  const hues = [["#12467A","#0C3259"],["#A51731","#7E0F23"],["#2A5A86","#12467A"],["#6B7280","#374151"]];
  function placeholder(label, i, video){
    const [a,b] = hues[i % hues.length];
    const txt = video ? T.placeholderVideo : T.placeholderImagen;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='400' height='500' fill='url(#g)'/><path d='M400 0v500H0z' fill='#fff' opacity='.06'/><path d='M400 180v60L0 440v-60z' fill='#fff' opacity='.08'/><text x='32' y='70' font-family='Arial' font-weight='700' font-size='22' fill='#fff' opacity='.85'>${txt}</text><text x='32' y='100' font-family='Arial' font-size='16' fill='#fff' opacity='.6'>${label.replace(/[<&'"]/g,"")}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  const eduBlock = e => `<h2>${esc(e.titulo)}</h2><p class="sub">${esc(e.subtitulo)}</p><p>${esc(e.texto)}</p>`;
  const ico = {
    wa:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3 3z"/><path d="M9 9.5c.3 2 2.3 4.2 5 5l1.2-1.2 2 1-.5 1.6c-3.5.6-8.4-3.4-9-7.6L9.3 7l1.2 2z"/></svg>`,
    mail:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
    ig:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg>`
  };

  window.__ph = (el, label, i, video) => {
    const img = document.createElement("img"); img.src = placeholder(label, i, video); img.alt = "";
    el.replaceWith(img);
  };
  function mediaFor(it, i, inLightbox){
    const fb = `onerror="__ph(this,'${esc(it.titulo).replace(/'/g,"")}',${i},${it.tipo !== "imagen"})"`;
    const src = it.src;
    if (it.tipo === "youtube" && src) {
      return inLightbox ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(src)}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="${esc(it.titulo)}"></iframe>`
                        : `<img src="https://i.ytimg.com/vi/${esc(src)}/hqdefault.jpg" alt="" loading="lazy">`;
    }
    if (it.tipo === "video" && src) {
      return inLightbox ? `<video src="${esc(src)}" controls autoplay playsinline ${fb}></video>`
                        : `<video src="${esc(src)}#t=0.5" muted playsinline preload="metadata" ${fb}></video>`;
    }
    const url = src ? esc(src) : placeholder(it.titulo, i, it.tipo !== "imagen");
    return `<img src="${url}" alt="${inLightbox ? esc(it.titulo) : ""}" loading="lazy" ${src ? fb : ""}>`;
  }
  function cardHTML(it, i){
    return `<button class="card" data-i="${i}" style="animation-delay:${i*90}ms" aria-label="${esc(T.verAria(it.titulo))}">
      <div class="card__media">${mediaFor(it,i,false)}${it.tipo !== "imagen" ? `<span class="play"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></span>` : ""}</div>
      <h4>${esc(it.titulo)}</h4><p>${esc(it.descripcion)}</p></button>`;
  }

  /* ---- Render all translatable content ---- */
  function renderContent(isSwitch){
    document.documentElement.lang = T.htmlLang;
    document.title = T.pageTitle;
    $("#nav").setAttribute("aria-label", T.navSecciones);
    $("#menuBtn").setAttribute("aria-label", T.menuAbrir);
    $("#logoImg").alt = T.logoAlt;
    $("#navInicio").textContent = T.navInicio;
    $("#navEducacion").textContent = T.navEducacion;
    $("#navExperiencia").textContent = T.navExperiencia;
    $("#navTrabajos").textContent = T.navTrabajos;
    $("#navContacto").textContent = T.navContacto;
    $("#ctaWork").textContent = T.ctaWork;
    $("#ctaContact").textContent = T.ctaContact;
    $("#dots").setAttribute("aria-label", T.dotsAria);
    $("#dots").querySelectorAll("button").forEach(b => b.setAttribute("aria-label", T.dotsGoTo(b.dataset.id)));
    $("#expTitle").textContent = T.expTitle;
    $("#workTitle").textContent = T.workTitle;
    $("#workHint").textContent = T.workHint;
    $("#prev").setAttribute("aria-label", T.prevAria);
    $("#next").setAttribute("aria-label", T.nextAria);
    $("#contactTitle").textContent = T.contactTitle;
    $("#contactLead").textContent = T.contactLead;
    $("#toTop").textContent = T.toTop;
    $("#lb").setAttribute("aria-label", T.lbAria);
    $("#lbClose").setAttribute("aria-label", T.lbClose);
    $("#lbPrev").setAttribute("aria-label", T.prevAria);
    $("#lbNext").setAttribute("aria-label", T.nextAria);
    $("#langBtn").textContent = T.langBtn;
    $("#langBtn").setAttribute("aria-label", T.langBtnAria);
    updateThemeBtn();

    /* Hero */
    $("#heroRol").textContent = C.hero.rol;
    $("#heroTitle").innerHTML = C.hero.titulo.split("|").map(l=>`<span class="ln"><span>${esc(l.trim())}</span></span>`).join("");
    $("#heroText").textContent = C.hero.texto;
    $("#heroFoto").src = asset(C.hero.foto);
    $("#heroFoto").alt = T.retratoAlt(C.nombre);
    $("#heroTag").textContent = C.nombre;

    /* Education */
    $("#eduSeal").src = asset(C.educacion.escudo);
    $("#eduSeal").alt = T.sealAlt;
    $("#eduPro").innerHTML = eduBlock(C.educacion.profesional);
    $("#eduCom").innerHTML = eduBlock(C.educacion.complementaria);
    $("#tools").innerHTML = C.herramientas.map(g => `<div class="tool rv-up"><h3>${esc(g.grupo)}</h3><ul>${
      g.items.map(t=>`<li class="chip" title="${esc(t.nombre)}"><b aria-hidden="true"><img src="${esc(t.icono)}" alt=""></b><span>${esc(t.nombre)}</span></li>`).join("")}</ul></div>`).join("");

    /* Experience */
    $("#timeline").innerHTML = C.experiencia.map(j => `<article class="job rv-up"><h3>${esc(j.empresa)}</h3><p class="role">${esc(j.puesto)}</p><p class="when">${esc(j.periodo)}</p><p>${esc(j.texto)}</p></article>`).join("");

    /* Contact */
    const k = C.contacto;
    $("#ways").innerHTML = `
      <a class="way rv-up" href="https://wa.me/${esc(k.whatsapp)}" target="_blank" rel="noopener"><span class="way__icon">${ico.wa}</span><strong>${esc(T.waLabel)}</strong><span>${esc(k.telefonoVisible)}</span><em>${esc(T.waCta)}</em></a>
      <a class="way rv-up" href="mailto:${esc(k.correo)}"><span class="way__icon">${ico.mail}</span><strong>${esc(T.mailLabel)}</strong><span>${esc(k.correo)}</span><em>${esc(T.mailCta)}</em></a>
      <a class="way rv-up" href="https://instagram.com/${esc(k.instagram)}" target="_blank" rel="noopener"><span class="way__icon">${ico.ig}</span><strong>${esc(T.igLabel)}</strong><span>@${esc(k.instagram)}</span><em>${esc(T.igCta)}</em></a>`;
    $("#footText").textContent = `© ${new Date().getFullYear()} ${C.nombre} · ${C.marca} · ${k.ciudad}`;

    /* Work tabs */
    $("#tabs").innerHTML = keys.map(key => `<button class="tab" data-key="${key}" aria-expanded="${String(key === current)}" aria-controls="gallery">${esc(C.trabajos[key].titulo)}<small>${C.trabajos[key].items.length} ${esc(T.piezas)}</small></button>`).join("");

    if (isSwitch) {
      // Content already revealed before the switch: show it instantly instead of replaying the scroll animation.
      $("#tools").querySelectorAll(".tool").forEach(el => el.classList.add("in"));
      $("#timeline").querySelectorAll(".job").forEach(el => el.classList.add("in"));
      $("#ways").querySelectorAll(".way").forEach(el => el.classList.add("in"));
      if (current) {
        items = C.trabajos[current].items;
        $("#stageTitle").textContent = C.trabajos[current].titulo;
        $("#stageCount").textContent = `${items.length} ${T.piezas}`;
        $("#track").innerHTML = items.map((it,i) => cardHTML(it,i)).join("");
        updateNav();
      }
    }
  }

  function setLanguage(lang){
    if (lang !== "es" && lang !== "en") return;
    LANG = lang; C = CONFIG[lang]; T = UI[lang];
    try { localStorage.setItem("lang", lang); } catch {}
    renderContent(true);
  }
  $("#langBtn").addEventListener("click", () => setLanguage(LANG === "es" ? "en" : "es"));

  renderContent(false);
  $("#toTop").onclick = () => scrollTo({top:0, behavior: reduce ? "auto" : "smooth"});

  /* ---- Work tabs + gallery ---- */
  const tabs = $("#tabs"), gallery = $("#gallery"), track = $("#track");

  function openCategory(key){
    const btns = tabs.querySelectorAll(".tab");
    if (current === key) { // toggle closed
      current = null; gallery.classList.remove("open");
      btns.forEach(b => b.setAttribute("aria-expanded","false")); return;
    }
    const wasOpen = gallery.classList.contains("open");
    current = key; items = C.trabajos[key].items;
    btns.forEach(b => b.setAttribute("aria-expanded", String(b.dataset.key === key)));
    const render = () => {
      $("#stageTitle").textContent = C.trabajos[key].titulo;
      $("#stageCount").textContent = `${items.length} ${T.piezas}`;
      track.innerHTML = items.map((it,i) => cardHTML(it,i)).join("");
      track.scrollLeft = 0; updateNav();
      gallery.classList.remove("open"); void gallery.offsetWidth; gallery.classList.add("open");
    };
    if (wasOpen && !reduce) { gallery.classList.remove("open"); setTimeout(render, 380); }
    else render();
    setTimeout(() => $("#stage").scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"nearest"}), wasOpen ? 700 : 350);
  }
  tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) openCategory(b.dataset.key); });

  const step = () => (track.querySelector(".card")?.offsetWidth || 300) + 22;
  $("#prev").onclick = () => track.scrollBy({left:-step(), behavior: reduce ? "auto" : "smooth"});
  $("#next").onclick = () => track.scrollBy({left: step(), behavior: reduce ? "auto" : "smooth"});
  function updateNav(){
    const max = track.scrollWidth - track.clientWidth;
    $("#prev").disabled = track.scrollLeft < 4;
    $("#next").disabled = track.scrollLeft > max - 4;
    const vis = track.clientWidth / Math.max(track.scrollWidth,1);
    $("#bar").style.width = Math.min(100, (vis + (max > 0 ? track.scrollLeft/max : 1) * (1 - vis)) * 100) + "%";
  }
  track.addEventListener("scroll", updateNav, {passive:true});
  addEventListener("resize", updateNav);

  /* ---- Lightbox ---- */
  const lb = $("#lb"); let lbIndex = 0, lastFocus = null;
  function showLb(i){
    lbIndex = (i + items.length) % items.length;
    const it = items[lbIndex];
    $("#lbMedia").innerHTML = mediaFor(it, lbIndex, true);
    $("#lbCap").innerHTML = `<b>${esc(it.titulo)}</b>${esc(it.descripcion)}`;
  }
  track.addEventListener("click", e => { const c = e.target.closest(".card"); if (!c) return;
    lastFocus = c; showLb(+c.dataset.i); lb.classList.add("open"); document.body.style.overflow = "hidden"; $("#lbClose").focus(); });
  const closeLb = () => { lb.classList.remove("open"); document.body.style.overflow = ""; setTimeout(()=>$("#lbMedia").innerHTML="",400); lastFocus?.focus(); };
  $("#lbClose").onclick = closeLb;
  $("#lbPrev").onclick = () => showLb(lbIndex - 1);
  $("#lbNext").onclick = () => showLb(lbIndex + 1);
  lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
  addEventListener("keydown", e => { if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLb(); if (e.key === "ArrowLeft") showLb(lbIndex-1); if (e.key === "ArrowRight") showLb(lbIndex+1); });

  /* ---- Mobile menu ---- */
  const nav = $("#nav"), mb = $("#menuBtn");
  mb.onclick = () => { const o = nav.classList.toggle("open"); mb.setAttribute("aria-expanded", o); };
  nav.addEventListener("click", e => { if (e.target.tagName === "A") { nav.classList.remove("open"); mb.setAttribute("aria-expanded","false"); } });

  /* ---- Section dots + active nav ---- */
  const sections = [...document.querySelectorAll("main > section")];
  const dots = $("#dots");
  dots.innerHTML = sections.map(s => `<button aria-label="${esc(T.dotsGoTo(s.id))}" data-id="${s.id}"></button>`).join("");
  dots.addEventListener("click", e => { const b = e.target.closest("button"); if (b) document.getElementById(b.dataset.id).scrollIntoView({behavior: reduce ? "auto" : "smooth"}); });
  const spy = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const id = en.target.id;
    dots.querySelectorAll("button").forEach(b => b.classList.toggle("is-active", b.dataset.id === id));
    nav.querySelectorAll("a").forEach(a => a.classList.toggle("is-active", a.getAttribute("href") === "#" + id));
    dots.classList.toggle("on-red", id === "experiencia" || id === "contacto");
  }), {rootMargin:"-45% 0px -50% 0px"});
  sections.forEach(s => spy.observe(s));

  /* ---- Reveal on scroll ---- */
  const rev = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("in"); rev.unobserve(en.target); }
  }), {threshold:.18});
  document.querySelectorAll(".rv,.rv-up,.job").forEach((el,i) => {
    if (el.matches(".tool,.job,.way")) el.style.transitionDelay = (Array.from(el.parentNode.children).indexOf(el) * 110) + "ms";
    rev.observe(el);
  });

  /* ---- Header compact + parallax ---- */
  const top = $("#top");
  const px = [...document.querySelectorAll("[data-parallax]")];
  let ticking = false;
  function frame(){
    const y = scrollY, vh = innerHeight;
    top.classList.toggle("is-compact", y > 40);
    if (!reduce) px.forEach(el => {
      const r = el.parentElement.getBoundingClientRect();
      const d = (r.top + r.height/2 - vh/2);
      const s = parseFloat(el.dataset.parallax);
      el.style.transform = `translate3d(0,${(d * s).toFixed(1)}px,0)` + (el.dataset.rotate ? ` rotate(${(d * -0.02).toFixed(2)}deg)` : "");
    });
    ticking = false;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, {passive:true});
  addEventListener("resize", frame);
  frame();
});
</script>


</body>
