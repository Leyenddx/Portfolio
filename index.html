<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aron Navarro · Diseño gráfico, video y diseño digital</title>
<meta name="description" content="Portafolio de Aron Navarro (Leyenddx): diseño gráfico, edición de video y diseño digital en Ciudad Juárez.">
<meta property="og:title" content="Aron Navarro · Portafolio">
<meta property="og:description" content="Diseño gráfico, edición de video y diseño digital.">
<meta property="og:image" content="img/thumbs/eci6.webp">
<link rel="icon" href="img/perfil.svg" type="image/svg+xml">

<!-- FUENTES: Archivo (títulos) y Lato (texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- ESTILOS: el orden importa (variables → base → componentes → secciones → responsive) -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/work.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/dock.css">
<link rel="stylesheet" href="css/reveal.css">
<link rel="stylesheet" href="css/lightbox.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip" href="#trabajos">Ir a los trabajos</a>

<!-- HEADER: logo, navegación, idioma, tema y botón de contacto siempre visible -->
<header class="top" id="top">
  <div class="wrap top__inner">
    <a class="logo" href="#inicio" id="logo">
      <img src="img/perfil.svg" alt="" width="20" height="40">
      <span>Leyenddx</span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones">
      <a href="#trabajos" id="navTrabajos">Trabajos</a>
      <a href="#perfil" id="navPerfil">Perfil</a>
      <a href="#contacto" id="navContacto">Contacto</a>
    </nav>
    <div class="top__tools">
      <button class="icon-btn lang-btn" id="langBtn" type="button" aria-label="Cambiar idioma">EN</button>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn btn--red btn--sm" href="#contacto" id="navCta">Contáctame</a>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav"><span></span><span></span></button>
    </div>
  </div>
</header>

<main>
  <!-- HERO: qué hago (en una línea), contacto directo y collage de trabajos -->
  <section class="hero" id="inicio">
    <div class="wrap hero__grid">
      <div class="hero__copy">
        <p class="badge"><i aria-hidden="true"></i><span id="heroDisponible"></span><span class="badge__sep" aria-hidden="true">·</span><span id="heroCiudad"></span></p>
        <h1 id="heroTitle"></h1>
        <p class="hero__text" id="heroText"></p>
        <div class="hero__cta">
          <a class="btn btn--solid" href="#trabajos" id="ctaWork">Ver trabajos</a>
          <a class="btn btn--ghost" id="ctaWa" target="_blank" rel="noopener"></a>
          <a class="btn btn--ghost" id="ctaMail"></a>
        </div>
        <a class="link-cv" id="ctaCV" target="_blank" rel="noopener"></a>
      </div>
      <div class="collage" id="collage"></div>
    </div>
    <div class="wrap clients">
      <span id="clientsTitle"></span>
      <ul id="clients"></ul>
    </div>
  </section>

  <!-- TRABAJOS: filtros por disciplina + tres bloques (diseño, video, digital) -->
  <section class="work" id="trabajos">
    <div class="filters" id="filtersBar">
      <div class="wrap filters__inner">
        <h2 id="workTitle">Trabajos seleccionados</h2>
        <div class="filters__group" id="filters" role="group" aria-label="Filtrar trabajos"></div>
      </div>
    </div>
    <div class="wrap" id="workBlocks"></div>
  </section>

  <!-- PERFIL: información general resumida (experiencia, habilidades, idiomas, herramientas, educación) -->
  <section class="profile" id="perfil">
    <div class="wrap">
      <h2 class="profile__title" id="perfilTitle">Perfil</h2>
      <div class="profile__grid">
        <article class="about rv-up">
          <img class="about__photo" id="perfilFoto" alt="" width="112" height="112">
          <div>
            <h3 id="perfilNombre"></h3>
            <p class="about__role" id="perfilRol"></p>
          </div>
          <p class="about__text" id="perfilTexto"></p>
          <a class="btn btn--ghost btn--sm" id="perfilCV" target="_blank" rel="noopener"></a>
        </article>
        <article class="pcard pcard--exp rv-up">
          <h3 id="expTitle">Experiencia</h3>
          <ol class="jobs" id="jobs"></ol>
        </article>
        <article class="pcard rv-up">
          <h3 id="skillsTitle">Habilidades</h3>
          <ul class="skills" id="skills"></ul>
        </article>
        <article class="pcard rv-up">
          <h3 id="langTitle">Idiomas</h3>
          <ul class="langs" id="langs"></ul>
          <h3 class="pcard__sub" id="eduTitle">Educación</h3>
          <div class="edu" id="edu"></div>
        </article>
        <article class="pcard pcard--tools rv-up">
          <h3 id="toolsTitle">Herramientas</h3>
          <ul class="tools" id="tools"></ul>
        </article>
      </div>
    </div>
  </section>

  <!-- CONTACTO: WhatsApp, correo (con copiar), Instagram, CV y pie de página -->
  <section class="contact" id="contacto">
    <div class="shape shape--blue" aria-hidden="true"></div>
    <div class="wrap">
      <p class="contact__kicker" id="contactKicker">Contacto</p>
      <h2 id="contactTitle">¿Trabajamos juntos?</h2>
      <p class="contact__lead" id="contactLead"></p>
      <div class="ways" id="ways"></div>
      <footer class="foot">
        <span id="footText"></span>
        <button type="button" id="toTop">Volver arriba</button>
      </footer>
    </div>
  </section>
</main>

<!-- DOCK: contacto rápido flotante (aparece al pasar la portada) -->
<aside class="dock" id="dock" aria-label="Contacto rápido"></aside>

<!-- LIGHTBOX: vista ampliada de imagen/video -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Vista ampliada" hidden>
  <button class="lb__btn lb__close" id="lbClose" type="button" aria-label="Cerrar">×</button>
  <button class="lb__btn lb__prev" id="lbPrev" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 4 7 12l8 8"/></svg></button>
  <figure><div class="lb__media" id="lbMedia"></div><figcaption id="lbCap"></figcaption></figure>
  <button class="lb__btn lb__next" id="lbNext" type="button" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<!-- DATOS: contenido y textos de interfaz (editar aquí para cambiar textos/trabajos/contacto) -->
<script src="js/data/thumbs.js"></script>
<script src="js/data/content-es.js"></script>
<script src="js/data/content-en.js"></script>
<script src="js/data/ui-es.js"></script>
<script src="js/data/ui-en.js"></script>

<!-- LÓGICA: el orden importa (core primero, main al final) -->
<script src="js/core.js"></script>
<script src="js/language.js"></script>
<script src="js/theme.js"></script>
<script src="js/media.js"></script>
<script src="js/render.js"></script>
<script src="js/gallery.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/navigation.js"></script>
<script src="js/scroll-effects.js"></script>
<script src="js/main.js"></script>

</body>
</html>
