<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aron · Portafolio 2026</title>

<!-- FUENTES: Archivo (títulos) y Lato (texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500;112..125,700;112..125,800;112..125,900&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- ESTILOS: el orden importa (variables → base → componentes → secciones → responsive) -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/dots.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/education.css">
<link rel="stylesheet" href="css/experience.css">
<link rel="stylesheet" href="css/work.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/reveal.css">
<link rel="stylesheet" href="css/lightbox.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- HEADER: logo, navegación, idioma, tema y menú móvil -->
<header class="top" id="top">
  <div class="top__bar">
    <div class="wrap top__inner">
      <a class="logo" href="#inicio" aria-label="Ir al inicio">
        <img src="img/perfil.svg" alt="Logo de mi portafolio" id="logoImg">
      </a>
      <nav class="nav" id="nav" aria-label="Secciones">
        <a href="#inicio" id="navInicio">Inicio</a>
        <a href="#educacion" id="navEducacion">Educación</a>
        <a href="#experiencia" id="navExperiencia">Experiencia</a>
        <a href="#trabajos" id="navTrabajos">Trabajos</a>
        <a href="#contacto" id="navContacto">Contacto</a>
      </nav>
      <button class="lang-btn" id="langBtn" type="button" aria-label="Cambiar idioma">EN</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Cambiar tema">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
  <div class="top__rule"></div>
</header>

<!-- DOTS: indicador lateral de secciones (se genera en js/navigation.js) -->
<nav class="dots" id="dots" aria-label="Progreso de secciones"></nav>

<main>
  <!-- HERO: portada, título, texto, botones y retrato -->
  <section class="hero" id="inicio">
    <div class="shape shape--band" data-parallax="-0.12"></div>
    <div class="shape shape--thin" data-parallax="0.18"></div>
    <div class="wrap hero__grid">
      <div>
        <p class="hero__kicker" id="heroRol"></p>
        <h1 id="heroTitle"></h1>
        <p class="hero__text" id="heroText"></p>
        <div class="hero__cta">
          <a class="btn btn--solid" href="#trabajos" id="ctaWork">Ver mi trabajo</a>
          <a class="btn btn--ghost" href="#contacto" id="ctaContact">Contactarme</a>
        </div>
      </div>
      <div class="portrait" data-parallax="-0.06">
        <div class="portrait__offset"></div>
        <div class="portrait__frame"><img id="heroFoto" alt=""></div>
        <div class="portrait__tag" id="heroTag"></div>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <!-- EDUCACIÓN: escudo, estudios y herramientas -->
  <section class="edu" id="educacion">
    <div class="shape shape--light" data-parallax="0.1"></div>
    <div class="wrap">
      <div class="edu__grid">
        <div class="seal" data-parallax="-0.08" data-rotate="1"><img id="eduSeal" alt=""></div>
        <div>
          <div class="edu__block rv-up" id="eduPro"></div>
          <div class="edu__block rv-up" id="eduCom"></div>
        </div>
      </div>
      <div class="tools" id="tools"></div>
    </div>
  </section>

  <!-- EXPERIENCIA: línea de tiempo de trabajos -->
  <section class="exp" id="experiencia">
    <div class="shape shape--tri" data-parallax="0.14"></div>
    <div class="wrap">
      <div class="panel rv-up">
        <h2 id="expTitle">Experiencia</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <!-- TRABAJOS: pestañas por categoría + galería deslizable -->
  <section class="work" id="trabajos">
    <div class="shape shape--red" data-parallax="0.08"></div>
    <div class="wrap">
      <h2 class="rv" id="workTitle">Mi trabajo</h2>
      <p class="work__hint" id="workHint">Elige una categoría para abrir la galería.</p>
      <div class="tabs" id="tabs" role="group" aria-label="Categorías de trabajo"></div>
      <div class="gallery" id="gallery">
        <div class="gallery__inner">
          <div class="stage" id="stage" aria-live="polite">
            <div class="stage__head"><h3 id="stageTitle"></h3><span id="stageCount"></span></div>
            <button class="arrow arrow--prev" id="prev" aria-label="Anterior"><svg viewBox="0 0 40 60"><path fill="var(--blue)" stroke="#fff" stroke-width="2" d="M38 2 2 30 38 58 26 30Z"/></svg></button>
            <div class="track" id="track"></div>
            <button class="arrow arrow--next" id="next" aria-label="Siguiente"><svg viewBox="0 0 40 60"><path fill="var(--blue)" stroke="#fff" stroke-width="2" d="M2 2 38 30 2 58 14 30Z"/></svg></button>

            <div class="progress"><i id="bar"></i></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTACTO: WhatsApp, correo, Instagram y pie de página -->
  <section class="contact" id="contacto">
    <div class="shape shape--blue" data-parallax="-0.1"></div>
    <div class="shape shape--paper" data-parallax="0.12"></div>
    <div class="wrap">
      <h2 class="rv" id="contactTitle">Hablemos</h2>
      <p class="contact__lead" id="contactLead">¿Tienes un proyecto de diseño, video o web? Escríbeme por el medio que prefieras.</p>
      <div class="ways" id="ways"></div>
      <div class="foot">
        <span id="footText"></span>
        <button id="toTop">Volver arriba</button>
      </div>
    </div>
  </section>
</main>

<!-- LIGHTBOX: vista ampliada de imagen/video -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Vista ampliada">
  <button class="lb__btn lb__close" id="lbClose" aria-label="Cerrar">×</button>
  <button class="lb__btn lb__prev" id="lbPrev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 4 7 12l8 8"/></svg></button>
  <figure><div class="lb__media" id="lbMedia"></div><figcaption id="lbCap"></figcaption></figure>
  <button class="lb__btn lb__next" id="lbNext" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="m9 4 8 8-8 8"/></svg></button>
</div>

<!-- DATOS: contenido y textos de interfaz (editar aquí para cambiar textos/trabajos/contacto) -->
<script src="js/data/content-es.js"></script>
<script src="js/data/content-en.js"></script>
<script src="js/data/ui-es.js"></script>
<script src="js/data/ui-en.js"></script>

<!-- LÓGICA: el orden importa (core primero, main al final) -->
<script src="js/core.js"></script>
<script src="js/language.js"></script>
<script src="js/theme.js"></script>
<script src="js/media.js"></script>
<script src="js/render.js"></script>
<script src="js/gallery.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/navigation.js"></script>
<script src="js/scroll-effects.js"></script>
<script src="js/main.js"></script>

</body>
</html>
